# Optional second container: starts only with --profile tunnel.
# Requires a real Tunnel ID and an untracked local key file.
services:
  tunnel-client:
    image: ghcr.io/openai/tunnel-client:v0.0.19@sha256:dcae53be336c062ffdc3f250a287b2a07724c344b8c370a50f54ad033af43151
    user: "${MCP_UID:-1000}:${MCP_GID:-1000}"
    profiles: ["tunnel"]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    depends_on:
      workstation-mcp:
        condition: service_healthy
    environment:
      CONTROL_PLANE_TUNNEL_ID: "${CONTROL_PLANE_TUNNEL_ID:?Set real tunnel ID}"
      MCP_SERVER_URL: "${MCP_SERVER_URL:-http://workstation-mcp:${MCP_PORT:-8765}${MCP_PATH:-/mcp}}"
      # Docker restart policies do not replay Compose depends_on ordering.
      # In v0.0.19 this also gates OAuth discovery/catalog finalization.
      MCP_STARTUP_WAIT_TIMEOUT: "120s"
      LOG_LEVEL: info
      LOG_FORMAT: json
    command:
      - run
      - --control-plane.api-key=file:/run/secrets/control-plane-api-key
    secrets:
      - control-plane-api-key
    networks: [mcp-internal]
secrets:
  control-plane-api-key:
    file: ${CONTROL_PLANE_API_KEY_FILE:-./secrets/control-plane-api-key}
